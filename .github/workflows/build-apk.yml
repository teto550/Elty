name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [native-android]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Copy web files
        run: |
          mkdir www
          cp index.html manifest.json sw.js icon-*.png www/

      - name: Add Android project
        run: npx cap add android

      - name: Add permissions to AndroidManifest
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ['ACCESS_COARSE_LOCATION', 'ACCESS_FINE_LOCATION', 'ACCESS_BACKGROUND_LOCATION',
                   'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_LOCATION', 'POST_NOTIFICATIONS', 'WAKE_LOCK']
          add = ''.join('    <uses-permission android:name="android.permission.%s" />\n' % x for x in perms)
          s = s.replace('<application', add + '    <application', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Sync and build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: elty-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
