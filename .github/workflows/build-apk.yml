name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [native-android, main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Copy web files
        run: |
          mkdir www
          cp index.html manifest.json sw.js icon-*.png www/

      - name: Add Android project
        run: npx cap add android

      - name: Configure Android project (permissions, battery plugin, icons)
        run: |
          pip install pillow
          python3 scripts/android_setup.py

      - name: Sync and build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: elty-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release (direct download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk elty.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest elty.apk --target "${{ github.sha }}" --title "علتي - أحدث نسخة أندرويد" --notes "نزّل elty.apk وثبّته على موبايل الأندرويد."
