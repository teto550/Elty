<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>علتي</title>
<meta name="theme-color" content="#1d4785">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="علتي">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#1c1c1e; --muted:#6b7280;
  --accent:#2563eb; --accent2:#16a34a; --border:#e5e7eb;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111214; --card:#1c1d20; --text:#f2f2f2; --muted:#9aa0a6; --border:#2c2d30;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:-apple-system,Roboto,"Segoe UI",Tahoma,Arial,sans-serif;
}
header{
  position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg);
  padding:16px 16px 8px; border-bottom:1px solid var(--border);
}
h1{font-size:20px; margin:0 0 4px;}
.sub{color:var(--muted); font-size:13px;}
main{padding:16px; max-width:480px; margin:0 auto;}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:14px;
  padding:14px 16px; margin-bottom:12px;
}
.me-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.me-name{font-weight:600;}
.small-btn{
  background:transparent; border:1px solid var(--border); color:var(--muted);
  padding:6px 10px; border-radius:8px; font-size:12px;
}
.share-btn{
  width:100%; padding:14px; border:none; border-radius:12px; background:var(--accent2);
  color:#fff; font-size:16px; font-weight:600; margin-top:10px;
}
.install-btn{
  width:100%; padding:12px; border:none; border-radius:12px; background:var(--accent);
  color:#fff; font-size:14px; font-weight:600; margin-bottom:12px;
}
.status{font-size:12px; color:var(--muted); margin-top:6px; min-height:16px;}
.member{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 4px; border-bottom:1px solid var(--border);
}
.member:last-child{border-bottom:none;}
.member-name{font-weight:600;}
.member-time{font-size:12px; color:var(--muted);}
.map-link{
  color:var(--accent); text-decoration:none; font-size:13px; font-weight:600;
  border:1px solid var(--accent); padding:6px 10px; border-radius:8px;
}
.name-setup{display:flex; flex-direction:column; gap:10px; align-items:center; text-align:center; padding-top:40px;}
.name-setup input{
  width:100%; max-width:260px; padding:12px; border-radius:10px; border:1px solid var(--border);
  background:var(--card); color:var(--text); font-size:16px; text-align:center;
}
.name-setup button{
  padding:12px 24px; border:none; border-radius:10px; background:var(--accent);
  color:#fff; font-size:15px; font-weight:600;
}
.role-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:260px;}
.name-setup .role-btn{
  padding:12px 8px; border-radius:10px; border:2px solid var(--border);
  background:var(--card); color:var(--text); font-size:16px; font-weight:600;
}
.name-setup .role-btn.sel{border-color:var(--accent); background:var(--accent); color:#fff;}
#map{height:55vh; min-height:320px; border-radius:10px; overflow:hidden; z-index:0; direction:ltr;}
.leaflet-popup-content{direction:rtl; text-align:right; font-family:inherit; line-height:1.7;}
.pin-wrap{background:none; border:none;}
.pin{position:absolute; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center;}
.pin-label{
  background:#1d4785; color:#fff; font-size:12px; font-weight:700; padding:3px 8px;
  border-radius:10px; white-space:nowrap; box-shadow:0 1px 4px rgba(0,0,0,.35);
}
.pin-dot{
  margin-top:2px; width:32px; height:32px; border-radius:50%; background:#fff; font-size:20px;
  display:flex; align-items:center; justify-content:center; border:2px solid #1d4785;
  box-shadow:0 1px 4px rgba(0,0,0,.35);
}
.pin.me .pin-label{background:#16a34a;}
.pin.me .pin-dot{border-color:#16a34a;}
.member-btns{display:flex; gap:6px; align-items:center;}
.hidden{display:none;}
.warn{
  background:#fef3c7; color:#92400e; border-radius:10px; padding:10px 12px; font-size:12px; margin-bottom:12px;
}
</style>
</head>
<body>

<header>
  <h1>👪 علتي</h1>
  <div class="sub">مكان كل واحد في البيت</div>
</header>

<main>
  <div id="warnBox" class="warn hidden"></div>
  <div id="batteryBox" class="warn hidden">
    لازم تسمح للتطبيق يشتغل في الخلفية من غير قيود توفير الطاقة، وإلا الموبايل هيوقف التتبع.
    <button class="install-btn" style="margin:8px 0 0" onclick="askBattery()">🔋 اسمح بالعمل في الخلفية</button>
  </div>
  <a id="apkBtn" class="install-btn" style="display:none; text-align:center; text-decoration:none;" href="https://github.com/teto550/elty/releases/download/latest/elty.apk">📲 نزّل تطبيق الأندرويد (بيشتغل في الخلفية)</a>
  <button id="installBtn" class="install-btn hidden" onclick="doInstall()">⬇️ ثبّت التطبيق على تليفونك</button>

  <div id="setupScreen" class="name-setup hidden">
    <div style="font-size:15px;">انت مين في العيلة؟</div>
    <div class="role-grid">
      <button type="button" class="role-btn" data-role="father">👨 أب</button>
      <button type="button" class="role-btn" data-role="mother">👩 أم</button>
      <button type="button" class="role-btn" data-role="son">👦 ابن</button>
      <button type="button" class="role-btn" data-role="daughter">👧 ابنة</button>
    </div>
    <div style="font-size:15px;">إيه اسمك؟</div>
    <input id="nameInput" placeholder="اكتب اسمك" maxlength="20">
    <button onclick="saveName()">تمام، ابدأ</button>
    <div class="status" id="setupMsg"></div>
  </div>

  <div id="appScreen" class="hidden">
    <div class="card">
      <div class="me-row">
        <div>👤 أنا: <span class="me-name" id="meName"></span> <span class="sub" id="meRole"></span></div>
        <button class="small-btn" onclick="changeName()">تغيير</button>
      </div>
      <button class="share-btn" onclick="shareLocation()">📍 شارك موقعي دلوقتي</button>
      <div class="status" id="statusMsg"></div>
      <div class="status" id="bgHint">الموقع بيتحدث طول ما التطبيق مفتوح على الشاشة.</div>
    </div>

    <div class="card" style="padding:8px;">
      <div id="map"></div>
      <button class="small-btn" style="margin-top:8px;" onclick="fitAll()">🎯 اعرض الكل</button>
    </div>

    <div class="card">
      <div style="font-weight:600; margin-bottom:6px;">أماكن العيلة</div>
      <div id="membersList"><div class="status">بنجيب البيانات...</div></div>
    </div>
  </div>
</main>

<script type="module">
// ⚙️ بيانات مشروع Firebase بتاعك
const firebaseConfig = {
  apiKey: "AIzaSyBiSgk74sDCw9ey1b45MVQinqo_QxJ4Ta0",
  authDomain: "elty-fc7d6.firebaseapp.com",
  projectId: "elty-fc7d6",
  storageBucket: "elty-fc7d6.firebasestorage.app",
  messagingSenderId: "467416499371",
  appId: "1:467416499371:web:8dcb9cb5a44fe35da2a3ee"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

function showWarn(msg) {
  const w = document.getElementById('warnBox');
  w.textContent = '⚠️ ' + msg;
  w.classList.remove('hidden');
}

let db = null;
try {
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
} catch (e) {
  showWarn('فشل تحميل Firebase: ' + (e && e.message ? e.message : e));
}

const myName = () => localStorage.getItem('elty_name');
const myRole = () => localStorage.getItem('elty_role');

function showScreen() {
  if (myName() && myRole()) {
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('meName').textContent = myName();
    const r = ROLES[myRole()];
    document.getElementById('meRole').textContent = r ? '(' + r.label + ')' : '';
    initMap();
    if (map) setTimeout(() => map.invalidateSize(), 0);
    if (db) listenMembers();
    startNativeTracking();
  } else {
    document.getElementById('setupScreen').classList.remove('hidden');
    document.getElementById('appScreen').classList.add('hidden');
    if (myName()) document.getElementById('nameInput').value = myName();
  }
}

let pickedRole = myRole();
function markRole() {
  document.querySelectorAll('.role-btn').forEach(b => b.classList.toggle('sel', b.dataset.role === pickedRole));
}
document.querySelectorAll('.role-btn').forEach(b => {
  b.onclick = () => { pickedRole = b.dataset.role; markRole(); };
});
markRole();

window.saveName = function() {
  const v = document.getElementById('nameInput').value.trim();
  const msg = document.getElementById('setupMsg');
  if (!pickedRole) { msg.textContent = 'اختار انت مين في العيلة الأول.'; return; }
  if (!v) { msg.textContent = 'اكتب اسمك.'; return; }
  msg.textContent = '';
  localStorage.setItem('elty_name', v);
  localStorage.setItem('elty_role', pickedRole);
  showScreen();
};

window.changeName = function() {
  stopNativeTracking();
  if (db && myName()) deleteDoc(doc(db, 'locations', myName())).catch(() => {});
  localStorage.removeItem('elty_name');
  localStorage.removeItem('elty_role');
  pickedRole = null;
  markRole();
  document.getElementById('nameInput').value = '';
  showScreen();
};

// ---- التتبع في الخلفية (نسخة تطبيق الأندرويد فقط) ----
const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
let bgPlugin = null;
let watcherId = null;
let lastNativeWrite = 0;

// الكتابة بتتم عن طريق HTTP native عشان أندرويد بيقيّد طلبات الـ WebView بعد 5 دقايق في الخلفية
async function writeLocationNative(lat, lng) {
  const name = encodeURIComponent(myName());
  const url = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/locations/${name}?key=${firebaseConfig.apiKey}`;
  await window.Capacitor.Plugins.CapacitorHttp.request({
    url,
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    data: { fields: {
      lat: { doubleValue: lat },
      lng: { doubleValue: lng },
      role: { stringValue: myRole() || '' },
      updatedAt: { integerValue: String(Date.now()) }
    } }
  });
}

let batteryPlugin = null;
async function checkBattery() {
  if (!isNative) return;
  try {
    if (!batteryPlugin) batteryPlugin = window.Capacitor.registerPlugin('ElityBattery');
    const r = await batteryPlugin.isIgnoring();
    document.getElementById('batteryBox').classList.toggle('hidden', !!r.value);
  } catch (e) {}
}
window.askBattery = async function() {
  try {
    if (!batteryPlugin) batteryPlugin = window.Capacitor.registerPlugin('ElityBattery');
    await batteryPlugin.request();
  } catch (e) {}
};

async function startNativeTracking() {
  if (!isNative || !myName()) return;
  checkBattery();
  if (watcherId) return;
  const statusEl = document.getElementById('statusMsg');
  try {
    const LN = window.Capacitor.Plugins.LocalNotifications;
    if (LN) await LN.requestPermissions();
  } catch (e) {}
  bgPlugin = window.Capacitor.registerPlugin('BackgroundGeolocation');
  try {
    watcherId = await bgPlugin.addWatcher({
      backgroundTitle: 'علتي',
      backgroundMessage: 'مشاركة موقعك مع العيلة شغالة',
      requestPermissions: true,
      stale: false,
      distanceFilter: 30
    }, async (loc, err) => {
      if (err) {
        if (err.code === 'NOT_AUTHORIZED') {
          statusEl.textContent = 'لازم تسمح بالموقع من إعدادات التطبيق.';
          bgPlugin.openSettings();
        }
        return;
      }
      if (!loc || Date.now() - lastNativeWrite < 30000) return;
      lastNativeWrite = Date.now();
      try {
        await writeLocationNative(loc.latitude, loc.longitude);
        statusEl.textContent = 'آخر تحديث للموقع: دلوقتي ✅';
      } catch (e) {
        statusEl.textContent = 'تعذر إرسال الموقع: ' + (e && e.message ? e.message : e);
      }
    });
  } catch (e) {
    statusEl.textContent = 'تعذر تشغيل التتبع: ' + (e && e.message ? e.message : e);
  }
}

function stopNativeTracking() {
  if (bgPlugin && watcherId) bgPlugin.removeWatcher({ id: watcherId });
  watcherId = null;
}

window.shareLocation = function() {
  const statusEl = document.getElementById('statusMsg');
  if (!db) { statusEl.textContent = 'التطبيق لسه مش متصل، جرب تقفل وتفتح تاني.'; return; }
  if (!navigator.geolocation) { statusEl.textContent = 'الجهاز مش بيدعم تحديد الموقع.'; return; }
  statusEl.textContent = 'بنجيب موقعك...';
  navigator.geolocation.getCurrentPosition(async (pos) => {
    try {
      await setDoc(doc(db, 'locations', myName()), {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        role: myRole() || '',
        updatedAt: Date.now()
      });
      statusEl.textContent = 'تم مشاركة موقعك ✅';
    } catch (e) {
      statusEl.textContent = 'حصل خطأ: ' + (e && e.message ? e.message : e);
    }
  }, () => {
    statusEl.textContent = 'مسموحش بالوصول للموقع، افتح الإعدادات وسمح.';
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
};

function timeAgo(ts) {
  if (!ts) return 'لسه محدش عرف مكانه';
  const diffMin = Math.round((Date.now() - ts) / 60000);
  if (diffMin < 1) return 'دلوقتي';
  if (diffMin < 60) return `من ${diffMin} دقيقة`;
  const h = Math.round(diffMin / 60);
  return `من ${h} ساعة`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const ROLES = {
  father: { label: 'أب', icon: '👨' },
  mother: { label: 'أم', icon: '👩' },
  son: { label: 'ابن', icon: '👦' },
  daughter: { label: 'ابنة', icon: '👧' }
};
let map = null, markers = {}, lastDocs = [], fitted = false;

function fmtTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts), now = new Date();
  const t = d.toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' });
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diffDays = Math.round((day(now) - day(d)) / 86400000);
  if (diffDays === 0) return 'النهاردة ' + t;
  if (diffDays === 1) return 'امبارح ' + t;
  return d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long' }) + ' ' + t;
}

function initMap() {
  if (map || !window.L) return;
  map = L.map('map').setView([30.0444, 31.2357], 11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(map);
}

window.fitAll = function() {
  if (!map) return;
  const pts = Object.values(markers).map(m => m.getLatLng());
  if (!pts.length) return;
  if (pts.length === 1) map.setView(pts[0], 16);
  else map.fitBounds(L.latLngBounds(pts), { padding: [50, 50], maxZoom: 17 });
};

function focusMember(id) {
  const m = markers[id];
  if (!m || !map) return;
  map.setView(m.getLatLng(), 17);
  m.openPopup();
  document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function pinIcon(id, role, isMe) {
  return L.divIcon({
    className: 'pin-wrap', iconSize: [0, 0],
    html: `<div class="pin${isMe ? ' me' : ''}"><div class="pin-label">${esc(id)}</div><div class="pin-dot">${role ? role.icon : '📍'}</div></div>`
  });
}

function renderMembers() {
  const list = document.getElementById('membersList');
  list.innerHTML = '';
  if (!lastDocs.length) list.innerHTML = '<div class="status">محدش شارك مكانه لسه.</div>';
  const seen = new Set();
  lastDocs.forEach(({ id, data }) => {
    const role = ROLES[data.role];
    const hasPos = data.lat && data.lng;
    const popup = `<b>${esc(id)}</b>${role ? ' (' + role.label + ')' : ''}<br>آخر تحديث للموقع:<br><b>${fmtTime(data.updatedAt)}</b><br>${timeAgo(data.updatedAt)}`;
    if (hasPos && map) {
      seen.add(id);
      const isMe = id === myName();
      if (markers[id]) {
        markers[id].setLatLng([data.lat, data.lng]);
        markers[id].setIcon(pinIcon(id, role, isMe));
        markers[id].setPopupContent(popup);
      } else {
        markers[id] = L.marker([data.lat, data.lng], { icon: pinIcon(id, role, isMe) }).addTo(map).bindPopup(popup);
      }
    }
    const row = document.createElement('div');
    row.className = 'member';
    row.innerHTML = `
      <div>
        <div class="member-name">${role ? role.icon + ' ' : ''}${esc(id)}${role ? ' <span class="member-time">(' + role.label + ')</span>' : ''}</div>
        <div class="member-time">آخر تحديث: ${fmtTime(data.updatedAt)} · ${timeAgo(data.updatedAt)}</div>
      </div>
      <div class="member-btns"></div>`;
    const btns = row.querySelector('.member-btns');
    if (hasPos) {
      const focus = document.createElement('button');
      focus.className = 'map-link'; focus.style.background = 'transparent';
      focus.textContent = '📍 على الخريطة';
      focus.onclick = () => focusMember(id);
      btns.appendChild(focus);
      const gm = document.createElement('a');
      gm.className = 'map-link'; gm.target = '_blank';
      gm.href = `https://www.google.com/maps?q=${data.lat},${data.lng}`;
      gm.textContent = '🗺️';
      btns.appendChild(gm);
    }
    list.appendChild(row);
  });
  Object.keys(markers).forEach(id => {
    if (!seen.has(id)) { markers[id].remove(); delete markers[id]; }
  });
  if (!fitted && Object.keys(markers).length) { fitted = true; fitAll(); }
}

let unsubMembers = null;
function listenMembers() {
  if (unsubMembers) unsubMembers();
  unsubMembers = onSnapshot(collection(db, 'locations'), (snap) => {
    lastDocs = [];
    snap.forEach(d => lastDocs.push({ id: d.id, data: d.data() }));
    renderMembers();
  }, (err) => showWarn('خطأ في القراءة: ' + err.message));
}
setInterval(() => { if (lastDocs.length) renderMembers(); }, 60000);

if (isNative) document.getElementById('bgHint').textContent = 'الموقع بيتحدث تلقائياً حتى لو التطبيق مقفول (لما تتحرك).';
if (!isNative && /android/i.test(navigator.userAgent)) document.getElementById('apkBtn').style.display = 'block';
showScreen();
let lastShare = 0;
const autoShare = () => {
  if (!isNative && db && myName() && document.visibilityState === 'visible') {
    lastShare = Date.now();
    shareLocation();
  }
};
setInterval(autoShare, 180000);
// أندرويد بيوقف التايمر والتطبيق في الخلفية، فنحدّث الموقع أول ما التطبيق يرجع قدام
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') checkBattery();
  if (document.visibilityState === 'visible' && Date.now() - lastShare > 60000) autoShare();
});

// ---- تثبيت التطبيق (PWA install prompt) ----
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').classList.remove('hidden');
});
window.doInstall = async function() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBtn').classList.add('hidden');
};
window.addEventListener('appinstalled', () => {
  document.getElementById('installBtn').classList.add('hidden');
});

// iOS مش بيدعم البانر التلقائي - نوريله تعليمات بسيطة
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
if (isIOS && !isStandalone) {
  const btn = document.getElementById('installBtn');
  btn.textContent = '⬇️ للتثبيت: دوس زر المشاركة 📤 ثم "إضافة إلى الشاشة الرئيسية"';
  btn.classList.remove('hidden');
  btn.onclick = null;
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
